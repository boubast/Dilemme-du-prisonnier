services:
  postgres:
    image: postgres:17
    container_name: projet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prisoners-dilemma
      POSTGRES_USER: bastienbogoss
      POSTGRES_PASSWORD: bastienbogoss
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: