services:
  postgres:
    image: postgres:17
    container_name: projet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prisoners-dilemma
      POSTGRES_USER: bastienbogoss
      POSTGRES_PASSWORD: bastienbogoss
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    env_file:
      - .env
    command: fastapi run app/main.py --host ${BACKEND_HOST} --port 8000
    ports:
      - "${BACKEND_PORT}:8000"

  frontend:
    build: ./frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  postgres_data:
